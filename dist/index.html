<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#172b49" />
    <meta
      name="description"
      content="A pixel-art office escape: solve a report conspiracy, outsmart HR and outrun one last follow-up."
    />
    <title>You're the Distraction</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main id="shell">
      <section id="screen" aria-label="You're the Distraction game">
        <canvas
          id="game"
          width="480"
          height="320"
          aria-label="Office exploration and chase. Controls and objectives are available in the pause menu."
        ></canvas>
        <div id="hud" hidden>
          <span id="act"></span><span id="danger"></span
          ><button id="pause" aria-label="Pause game">Ⅱ</button>
        </div>
        <div id="prompt" aria-live="polite"></div>
        <div id="toast" role="status"></div>
        <div id="overlay"></div>
      </section>
      <div id="touch" aria-label="Game controls">
        <div class="pad">
          <button data-hold="w" aria-label="Move up or jump">↑</button
          ><button data-hold="a" aria-label="Move left">←</button
          ><button data-hold="s" aria-label="Move down or slide">↓</button
          ><button data-hold="d" aria-label="Move right">→</button>
        </div>
        <div class="actions">
          <button data-press="e">E / ACT</button
          ><button data-press=" ">JUMP</button
          ><button data-press="s">SLIDE</button
          ><button data-press="escape">MENU</button>
        </div>
      </div>
      <p id="keyhelp">
        WASD / arrows · E interact · I bag · J journal · Esc pause
      </p>
    </main>
    <script type="module" src="app.js"></script>
  </body>
</html>
